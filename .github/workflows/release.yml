name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Static Binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install musl tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Build static musl release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify static linkage and binary size (< 5 MB)
        run: |
          BIN="target/${{ matrix.target }}/release/manis"
          ls -lh "$BIN"
          file "$BIN"
          file "$BIN" | grep -qE "statically linked|static-pie linked"
          SIZE=$(stat -c%s "$BIN")
          echo "Binary size: ${SIZE} bytes"
          test "$SIZE" -lt 5242880

      - name: Package tarball
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="manis-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${PKG}"
          cp "target/${{ matrix.target }}/release/manis" "dist/${PKG}/manis"
          cp LICENSE README.md "dist/${PKG}/"
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: manis-${{ matrix.target }}
          path: dist/*.tar.gz

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
