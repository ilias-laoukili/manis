[package]
name = "manis"
version = "0.1.0"
edition = "2021"
description = "Declarative, zero-dependency Linux hardening audit CLI mapped to CIS Benchmarks, ANSSI-BP-028, and NIST SP 800-53."
license = "Apache-2.0"
repository = "https://github.com/ilias-laoukili/manis"
homepage = "https://github.com/ilias-laoukili/manis"
keywords = ["security", "linux", "hardening", "cis", "audit"]
categories = ["command-line-utilities", "os::linux-apis"]
rust-version = "1.75"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
