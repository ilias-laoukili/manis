id = "FW-004"
title = "Ensure host firewall loopback traffic rules are configured"
description = "Verifies that the active host firewall accepts loopback interface (lo) traffic and drops spoofed 127.0.0.0/8 traffic on non-loopback interfaces."
severity = "medium"
profiles = ["cis-l1-server", "anssi-intermediary", "anssi-reinforced"]
artifact_uri = "etc/ufw/before.rules"
remediation = '''
Ensure loopback rules allow 'lo' and drop spoofed 127.0.0.0/8 packets:
  sudo ufw allow in on lo
  sudo ufw deny in from 127.0.0.0/8
'''

[references]
cis = ["4.2.4"]
anssi = []
nist = ["SC-7"]

[check]
type = "firewall_config"
mode = "loopback_configured"
