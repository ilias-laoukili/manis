id = "FW-001"
title = "Ensure a host firewall package is installed (UFW or nftables)"
description = "Verifies that either 'ufw' or 'nftables' is installed in /var/lib/dpkg/status."
severity = "high"
profiles = ["cis-l1-server", "anssi-intermediary", "anssi-reinforced"]
remediation = '''
Install UFW or nftables:
  sudo apt-get update && sudo apt-get install -y ufw
'''

[references]
cis = ["4.2.1"]
anssi = []
nist = ["SC-7"]

[check]
type = "package_state"
mode = "any_installed"
packages = ["ufw", "nftables"]
