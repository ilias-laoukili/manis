id = "NET-002"
title = "IPv6 stack disabled or hardened"
description = "Verifies that IPv6 is either disabled (via net.ipv6.conf.all.disable_ipv6=1 or kernel boot parameter ipv6.disable=1) or hardened against source routing, router advertisements, ICMP redirects, and packet forwarding."
severity = "medium"
profiles = ["cis-l1-server", "anssi-intermediary", "anssi-reinforced"]

remediation = """
Either disable IPv6 if unused:
  net.ipv6.conf.all.disable_ipv6 = 1
  net.ipv6.conf.default.disable_ipv6 = 1
Or harden active IPv6 in /etc/sysctl.d/99-manis-network-ipv6.conf:
  net.ipv6.conf.all.accept_source_route = 0
  net.ipv6.conf.all.accept_ra = 0
  net.ipv6.conf.default.accept_ra = 0
  net.ipv6.conf.all.accept_redirects = 0
  net.ipv6.conf.all.forwarding = 0
Then run: sudo sysctl --system
"""

[references]
cis = ["3.3.1", "3.3.5", "3.3.11"]
anssi = ["R13"]
nist = ["CM-6", "CM-7", "SC-7"]


[check]
type = "sysctl"
on_missing = "warn"
pass_if_cmdline_contains = ["ipv6.disable=1"]

[[check.pass_if_sysctl]]
key = "net.ipv6.conf.all.disable_ipv6"
op = "eq"
value = "1"

[[check.params]]
key = "net.ipv6.conf.all.accept_source_route"
op = "eq"
value = "0"

[[check.params]]
key = "net.ipv6.conf.all.accept_ra"
op = "eq"
value = "0"

[[check.params]]
key = "net.ipv6.conf.default.accept_ra"
op = "eq"
value = "0"

[[check.params]]
key = "net.ipv6.conf.all.accept_redirects"
op = "eq"
value = "0"

[[check.params]]
key = "net.ipv6.conf.all.forwarding"
op = "eq"
value = "0"
