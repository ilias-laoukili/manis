id = "SUDO-005"
title = "Prevent disabling sudo re-authentication (!authenticate)"
description = "Verifies that sudoers Defaults do not globally disable re-authentication via '!authenticate'."
severity = "high"
profiles = ["cis-l1-server", "anssi-intermediary", "anssi-reinforced"]
remediation = """
Audit sudoers files with 'sudo visudo' and remove any '!authenticate' Defaults entries.
"""

[references]
cis = ["5.2.5"]
anssi = []
nist = ["AC-6", "IA-2"]

[check]
type = "sudoers"
mode = "forbid_no_authenticate"
file = "/etc/sudoers"
include_dir = "/etc/sudoers.d"
