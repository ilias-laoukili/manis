id = "SUDO-001"
title = "Restrict broad root sudoers grants"
description = "Verifies that /etc/sudoers and /etc/sudoers.d/* do not grant unrestricted root command execution ((ALL) ALL or (root) ALL) to non-root principals."
severity = "high"
profiles = ["anssi-minimal", "anssi-intermediary", "anssi-reinforced"]

remediation = """
Audit sudoers rules with 'sudo visudo' and replace broad grants such as '%sudo ALL=(ALL:ALL) ALL' with least-privilege rules specifying explicit target users and exact command paths.
"""

[references]
cis = []
anssi = ["R40"]
nist = ["AC-6"]


[check]
type = "sudoers"
mode = "forbid_broad_root_targets"
file = "/etc/sudoers"
include_dir = "/etc/sudoers.d"
ignore_users = ["root"]
