id = "BOOT-002"
title = "Configure GRUB bootloader PBKDF2 password"
description = "Verifies that /boot/grub/grub.cfg configures a PBKDF2 password hash (password_pbkdf2) to protect boot parameters and single-user mode."
severity = "high"
profiles = ["cis-l1-server", "anssi-intermediary", "anssi-reinforced"]
artifact_uri = "boot/grub/grub.cfg"
remediation = '''
Generate a PBKDF2 hash with 'grub-mkpasswd-pbkdf2', configure superusers and password_pbkdf2 in /etc/grub.d/40_custom, then run:
  sudo update-grub
'''

[references]
cis = ["1.4.1"]
anssi = []
nist = ["IA-2", "IA-5"]

[check]
type = "file_content"
mode = "regex"
match_mode = "any_line"
paths = ["/boot/grub/grub.cfg"]
pattern = '^password_pbkdf2\s+\S+\s+grub\.pbkdf2\.'
