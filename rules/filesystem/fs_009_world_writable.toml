id = "FS-009"
title = "Ensure world-writable files and directories are secured"
description = "Scans the filesystem (excluding /proc, /sys, /dev, /run) to verify that no world-writable regular files exist and that every world-writable directory has the sticky bit (+t) set."
severity = "high"
profiles = ["cis-l1-server", "anssi-minimal", "anssi-intermediary", "anssi-reinforced", "linux-generic"]
artifact_uri = "tmp"
remediation = '''
Remove world-writable permissions from regular files and enforce the sticky bit on shared world-writable directories:
  sudo chmod o-w <file>
  sudo chmod a+t <directory>
'''

[references]
cis = ["7.1.11"]
anssi = []
nist = ["AC-6", "CM-6"]

[check]
type = "world_writable"
search_roots = ["/"]
skip_dirs = ["/proc", "/sys", "/dev", "/run"]
check_files = true
check_dirs_without_sticky = true
