id = "FILE-004"
title = "Restrict permissions and ownership on /etc/group-"
description = "Verifies that /etc/group- is owned by root (allowed GIDs [0]) with permissions no more permissive than 0644."
severity = "medium"
profiles = ["cis-l1-server", "anssi-minimal", "anssi-intermediary", "anssi-reinforced", "linux-generic"]
remediation = """
Enforce ownership and restrictive permissions on /etc/group-:
  sudo chown root:root /etc/group-
  sudo chmod 0644 /etc/group-
"""

[references]
cis = ["7.1.4"]
anssi = []
nist = ["AC-6"]

[check]
type = "file_meta"
path = "/etc/group-"
max_mode = "0644"
expected_uid = 0
allowed_gids = [0]
on_missing = "skip"
