id = "FS-007"
title = "Disable unused filesystem kernel module (jffs2)"
description = "Verifies that the legacy/uncommon 'jffs2' filesystem kernel module is disabled via /etc/modprobe.d/*.conf to reduce kernel attack surface."
severity = "low"
profiles = ["cis-l1-server", "anssi-intermediary", "anssi-reinforced", "linux-generic"]
artifact_uri = "etc/modprobe.d/cis-filesystems.conf"
remediation = """
Add the following lines to /etc/modprobe.d/cis-filesystems.conf:
  install jffs2 /bin/false
  blacklist jffs2
"""

[references]
cis = ["1.1.1.5"]
anssi = []
nist = ["CM-7"]

[check]
type = "file_content"
mode = "regex"
match_mode = "any_line"
paths = ["/etc/modprobe.d/*.conf"]
pattern = "^(install\\s+jffs2\\s+(/bin/true|/bin/false|/usr/bin/true|/usr/bin/false)|blacklist\\s+jffs2\\b)"
