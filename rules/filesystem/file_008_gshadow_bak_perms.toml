id = "FILE-008"
title = "Restrict permissions and ownership on /etc/gshadow-"
description = "Verifies that /etc/gshadow- is owned by root (allowed GIDs [0, 42]) with permissions no more permissive than 0640."
severity = "medium"
profiles = ["cis-l1-server", "anssi-minimal", "anssi-intermediary", "anssi-reinforced", "linux-generic"]
remediation = """
Enforce ownership and restrictive permissions on /etc/gshadow-:
  sudo chown root:shadow /etc/gshadow-
  sudo chmod 0640 /etc/gshadow-
"""

[references]
cis = ["7.1.8"]
anssi = []
nist = ["AC-6"]

[check]
type = "file_meta"
path = "/etc/gshadow-"
max_mode = "0640"
expected_uid = 0
allowed_gids = [0, 42]
on_missing = "skip"
