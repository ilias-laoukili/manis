id = "FS-006"
title = "Disable unused filesystem kernel module (hfsplus)"
description = "Verifies that the legacy/uncommon 'hfsplus' filesystem kernel module is disabled via /etc/modprobe.d/*.conf to reduce kernel attack surface."
severity = "low"
profiles = ["cis-l1-server", "anssi-intermediary", "anssi-reinforced"]
artifact_uri = "etc/modprobe.d/cis-filesystems.conf"
remediation = """
Add the following lines to /etc/modprobe.d/cis-filesystems.conf:
  install hfsplus /bin/false
  blacklist hfsplus
"""

[references]
cis = ["1.1.1.4"]
anssi = []
nist = ["CM-7"]

[check]
type = "file_content"
mode = "regex"
match_mode = "any_line"
paths = ["/etc/modprobe.d/*.conf"]
pattern = "^(install\\s+hfsplus\\s+(/bin/true|/bin/false|/usr/bin/true|/usr/bin/false)|blacklist\\s+hfsplus\\b)"
