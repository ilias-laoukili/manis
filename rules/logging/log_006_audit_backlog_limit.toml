id = "LOG-006"
title = "Configure sufficient audit_backlog_limit (>= 8192)"
description = "Verifies that /proc/cmdline or /etc/default/grub configures audit_backlog_limit=8192 or greater to avoid dropping early boot audit records."
severity = "low"
profiles = ["cis-l1-server", "anssi-intermediary", "anssi-reinforced"]
artifact_uri = "etc/default/grub"
remediation = '''
Add 'audit_backlog_limit=8192' to GRUB_CMDLINE_LINUX in /etc/default/grub and run:
  sudo update-grub
'''

[references]
cis = ["6.2.1.4"]
anssi = []
nist = ["AU-4", "AU-12"]

[check]
type = "file_content"
mode = "regex"
match_mode = "any_line"
paths = ["/proc/cmdline", "/etc/default/grub"]
pattern = '\baudit_backlog_limit=([89][0-9]{3}|[1-9][0-9]{4,})\b'
