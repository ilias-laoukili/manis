id = "LOG-009"
title = "Audit changes to sudoers configuration"
description = "Verifies that /etc/audit/rules.d/*.rules monitors modifications to /etc/sudoers and /etc/sudoers.d."
severity = "high"
profiles = ["cis-l1-server", "anssi-intermediary", "anssi-reinforced", "linux-generic"]
artifact_uri = "etc/audit/rules.d/50-scope.rules"
remediation = '''
Add to /etc/audit/rules.d/50-scope.rules and run 'sudo augenrules --load':
  -w /etc/sudoers -p wa -k scope
  -w /etc/sudoers.d -p wa -k scope
'''

[references]
cis = ["6.2.3.1"]
anssi = []
nist = ["AU-2", "AU-12"]

[check]
type = "file_content"
mode = "regex"
match_mode = "any_line"
paths = ["/etc/audit/rules.d/*.rules"]
pattern = '^-w\s+/etc/sudoers\b'
