id = "LOG-011"
title = "Audit modifications to user and group identity files"
description = "Verifies that /etc/audit/rules.d/*.rules watches /etc/passwd, /etc/shadow, /etc/group, and /etc/gshadow for modifications."
severity = "high"
profiles = ["cis-l1-server", "anssi-intermediary", "anssi-reinforced", "linux-generic"]
artifact_uri = "etc/audit/rules.d/50-identity.rules"
remediation = '''
Add identity watch rules to /etc/audit/rules.d/50-identity.rules and run 'sudo augenrules --load':
  -w /etc/group -p wa -k identity
  -w /etc/passwd -p wa -k identity
  -w /etc/gshadow -p wa -k identity
  -w /etc/shadow -p wa -k identity
'''

[references]
cis = ["6.2.3.8"]
anssi = []
nist = ["AU-2", "AU-12"]

[check]
type = "file_content"
mode = "regex"
match_mode = "any_line"
paths = ["/etc/audit/rules.d/*.rules"]
pattern = '^-w\s+/etc/(passwd|shadow|group|gshadow)\b'
