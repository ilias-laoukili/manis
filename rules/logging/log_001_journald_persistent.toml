id = "LOG-001"
title = "Configure systemd-journald persistent log storage"
description = "Verifies that /etc/systemd/journald.conf (or drop-ins) sets Storage=persistent so logs survive system reboots."
severity = "medium"
profiles = ["cis-l1-server", "anssi-intermediary", "anssi-reinforced"]
artifact_uri = "etc/systemd/journald.conf"
remediation = '''
Set Storage=persistent in /etc/systemd/journald.conf.d/99-manis.conf:
  [Journal]
  Storage=persistent
Then restart: sudo systemctl restart systemd-journald
'''

[references]
cis = ["6.1.1.3"]
anssi = []
nist = ["AU-4", "AU-9"]

[check]
type = "file_content"
mode = "regex"
match_mode = "any_line"
paths = ["/etc/systemd/journald.conf", "/etc/systemd/journald.conf.d/*.conf"]
pattern = '^Storage\s*=\s*persistent\b'
