id = "LOG-005"
title = "Enable kernel auditing for early boot processes (audit=1)"
description = "Verifies that /proc/cmdline or /etc/default/grub includes 'audit=1' so processes launched before auditd starts are audited."
severity = "medium"
profiles = ["cis-l1-server", "anssi-intermediary", "anssi-reinforced"]
artifact_uri = "etc/default/grub"
remediation = '''
Add 'audit=1' to GRUB_CMDLINE_LINUX in /etc/default/grub and run:
  sudo update-grub
'''

[references]
cis = ["6.2.1.3"]
anssi = []
nist = ["AU-12"]

[check]
type = "file_content"
mode = "regex"
match_mode = "any_line"
paths = ["/proc/cmdline", "/etc/default/grub"]
pattern = '\baudit=1\b'
