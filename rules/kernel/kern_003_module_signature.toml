id = "KERN-003"
title = "Kernel module cryptographic signature enforcement"
description = "Verifies that the running kernel was compiled with mandatory SHA-512 module signature verification and strict RWX permissions for loaded modules."
severity = "high"
profiles = ["anssi-reinforced", "linux-generic"]

remediation = """
Kernel compilation options cannot be altered at runtime. Build or install a signed hardened kernel with:
  CONFIG_MODULE_SIG=y
  CONFIG_MODULE_SIG_FORCE=y
  CONFIG_MODULE_SIG_ALL=y
  CONFIG_MODULE_SIG_SHA512=y
  CONFIG_MODULE_SIG_HASH="sha512"
  CONFIG_STRICT_MODULE_RWX=y
"""

[references]
cis = []
anssi = ["R18"]
nist = ["SI-7"]


[check]
type = "kernel_config"

[[check.options]]
name = "CONFIG_MODULE_SIG"
expected = "y"

[[check.options]]
name = "CONFIG_MODULE_SIG_FORCE"
expected = "y"

[[check.options]]
name = "CONFIG_MODULE_SIG_ALL"
expected = "y"

[[check.options]]
name = "CONFIG_MODULE_SIG_SHA512"
expected = "y"

[[check.options]]
name = "CONFIG_MODULE_SIG_HASH"
expected = "\"sha512\""

[[check.options]]
name = "CONFIG_STRICT_MODULE_RWX"
expected = "y"
