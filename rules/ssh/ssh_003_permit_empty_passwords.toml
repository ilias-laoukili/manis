id = "SSH-003"
title = "Disable empty password login over SSH"
description = "Verifies that PermitEmptyPasswords is explicitly set to 'no' in OpenSSH server configuration."
severity = "critical"
profiles = ["cis-l1-server", "anssi-minimal", "anssi-intermediary", "anssi-reinforced", "linux-generic"]
remediation = """
Set in /etc/ssh/sshd_config.d/01-hardening.conf:
  PermitEmptyPasswords no
Then validate and reload: sudo sshd -t && sudo systemctl reload ssh
"""

[references]
cis = ["5.1.19"]
anssi = []
nist = ["IA-5"]

[check]
type = "sshd_config"
file = "/etc/ssh/sshd_config"

[[check.params]]
key = "PermitEmptyPasswords"
op = "eq"
value = "no"
