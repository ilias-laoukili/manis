id = "SSH-007"
title = "Configure SSH audit logging level (LogLevel)"
description = "Verifies that sshd LogLevel is explicitly set to VERBOSE or INFO so login and key fingerprint events are recorded."
severity = "medium"
profiles = ["cis-l1-server", "anssi-intermediary", "anssi-reinforced", "linux-generic"]
remediation = """
Set in /etc/ssh/sshd_config.d/01-hardening.conf:
  LogLevel VERBOSE
Then validate and reload: sudo sshd -t && sudo systemctl reload ssh
"""

[references]
cis = ["5.1.14"]
anssi = []
nist = ["AU-3", "AU-12"]

[check]
type = "sshd_config"
file = "/etc/ssh/sshd_config"

[[check.params]]
key = "LogLevel"
op = "in"
values = ["VERBOSE", "INFO"]
