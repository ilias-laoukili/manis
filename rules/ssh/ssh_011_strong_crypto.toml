id = "SSH-011"
title = "Restrict SSH to strong Ciphers, MACs, and KexAlgorithms"
description = "Verifies that OpenSSH explicitly restricts Ciphers, MACs, and KexAlgorithms to modern approved cryptographic primitives."
severity = "high"
profiles = ["cis-l1-server", "anssi-intermediary", "anssi-reinforced", "linux-generic"]
remediation = """
Set strong algorithms in /etc/ssh/sshd_config.d/01-hardening.conf:
  Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
  MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
  KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group-exchange-sha256
Then validate and reload: sudo sshd -t && sudo systemctl reload ssh
"""

[references]
cis = ["5.1.6", "5.1.12", "5.1.15"]
anssi = []
nist = ["SC-8", "SC-13"]

[check]
type = "sshd_config"
file = "/etc/ssh/sshd_config"

[[check.params]]
key = "Ciphers"
op = "subset_of"
values = [
  "chacha20-poly1305@openssh.com",
  "aes256-gcm@openssh.com",
  "aes128-gcm@openssh.com",
  "aes256-ctr",
  "aes192-ctr",
  "aes128-ctr",
]

[[check.params]]
key = "MACs"
op = "subset_of"
values = [
  "hmac-sha2-512-etm@openssh.com",
  "hmac-sha2-256-etm@openssh.com",
  "umac-128-etm@openssh.com",
  "hmac-sha2-512",
  "hmac-sha2-256",
]

[[check.params]]
key = "KexAlgorithms"
op = "subset_of"
values = [
  "sntrup761x25519-sha512@openssh.com",
  "mlkem768x25519-sha256",
  "curve25519-sha256",
  "curve25519-sha256@libssh.org",
  "ecdh-sha2-nistp256",
  "ecdh-sha2-nistp384",
  "ecdh-sha2-nistp521",
  "diffie-hellman-group16-sha512",
  "diffie-hellman-group18-sha512",
  "diffie-hellman-group-exchange-sha256",
]
