id = "SVC-009"
title = "Ensure FTP server daemon (vsftpd.service) is disabled or masked"
description = "Verifies via /etc/systemd/system that FTP server daemon (vsftpd.service) is not enabled in any systemd target wants directory or is explicitly masked to /dev/null."
severity = "high"
profiles = ["cis-l1-server", "anssi-minimal", "anssi-intermediary", "anssi-reinforced"]
remediation = '''
Stop, disable, and mask the service (or purge its package if unused):
  sudo systemctl --now mask <unit>
'''

[references]
cis = []
anssi = []
nist = ["CM-7"]

[check]
type = "service_state"
mode = "all_disabled_or_masked"
units = ["vsftpd.service"]
